name: myusp-docker-release

on:
  workflow_dispatch:
    inputs:
      build_amd64:
        description: '🖥️  linux/amd64'
        type: boolean
        default: true
      build_arm64:
        description: '📱 linux/arm64'
        type: boolean
        default: true
      build_armv7:
        description: '🍓 linux/arm/v7 (Raspberry Pi)'
        type: boolean
        default: false
      build_latest:
        description: '🐳 Build :latest tag (Chromium + WEBJS)'
        type: boolean
        default: true
      build_gows:
        description: '⚙️  Build :gows tag (GOWS engine)'
        type: boolean
        default: true

env:
  IMAGE: keyusroe/waha

jobs:
  build:
    if: ${{ inputs.build_latest || inputs.build_gows }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute platforms
        id: platforms
        run: |
          PLATFORMS=""
          if [[ "${{ inputs.build_amd64 }}" == "true" ]]; then PLATFORMS="$PLATFORMS,linux/amd64"; fi
          if [[ "${{ inputs.build_arm64 }}" == "true" ]]; then PLATFORMS="$PLATFORMS,linux/arm64"; fi
          if [[ "${{ inputs.build_armv7 }}" == "true" ]]; then PLATFORMS="$PLATFORMS,linux/arm/v7"; fi
          echo "list=${PLATFORMS#,}" >> $GITHUB_OUTPUT

      - name: Build and push :latest
        if: ${{ inputs.build_latest }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest

      - name: Build and push :gows
        if: ${{ inputs.build_gows }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ env.IMAGE }}:gows
          build-args: |
            USE_BROWSER=none
            WHATSAPP_DEFAULT_ENGINE=GOWS
          cache-from: type=gha,scope=gows
          cache-to: type=gha,mode=max,scope=gows
